<svg width="900" height="400" viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">ibni andarta — Mahasiswa Teknologi Informasi, Politeknik Negeri Malang</title>
  <desc id="hero-desc">Kartu terminal monokrom: prompt ibni@polinema:~$ whoami, nama ibni andarta, dan foto profil 1-bit.</desc>

  <defs>
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#e8e8e3" fill-opacity="0.1"/>
    </pattern>
    <radialGradient id="dot-fade" cx="78%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="dot-mask">
      <rect width="900" height="400" fill="url(#dot-fade)"/>
    </mask>
  </defs>

  <rect width="900" height="400" fill="#0a0a0a"/>
  <rect width="900" height="400" fill="url(#dot-grid)" mask="url(#dot-mask)"/>

  <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <circle cx="43.5" cy="59.5" r="3.5" fill="#e8e8e3">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="56" y="64" fill="#8c8c86" font-size="13" letter-spacing="1.04">MAHASISWA AKTIF · MALANG, ID</text>

    <text x="40" y="104" font-size="15" letter-spacing="-0.2"><tspan fill="#8c8c86">ibni@polinema:~$</tspan><tspan fill="#b3b3ad"> whoami</tspan></text>

    <text x="40" y="176" fill="#e8e8e3" font-size="62" font-weight="600" letter-spacing="-3.7" textLength="410" lengthAdjust="spacing">ibni andarta</text>
    <rect x="460" y="130" width="8" height="46" fill="#e8e8e3">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.49;0.5;0.99;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <text x="40" y="216" fill="#e8e8e3" font-size="17" letter-spacing="-0.3">Mahasiswa Teknologi Informasi</text>
    <text x="40" y="242" font-size="15" letter-spacing="-0.2" fill="#b3b3ad">Politeknik Negeri Malang</text>

    <text x="40" y="280" fill="#b3b3ad" font-size="16" letter-spacing="-0.2">Membangun aplikasi web dan tools praktis—</text>
    <text x="40" y="304" fill="#b3b3ad" font-size="16" letter-spacing="-0.2">dari skema database sampai antarmuka.</text>

    <rect x="40" y="338" width="540" height="1" fill="#262626"/>
    <text x="40" y="362" fill="#8c8c86" font-size="13" letter-spacing="0.2">Malang, ID</text>
    <text x="580" y="362" fill="#8c8c86" font-size="13" letter-spacing="0.2" text-anchor="end">ibni.me</text>
  </g>

  <image x="620" y="40" width="240" height="320" preserveAspectRatio="none" image-rendering="pixelated" href="data:image/png;base64,"/>
  <rect x="619.5" y="39.5" width="241" height="321" fill="none" stroke="#262626" stroke-width="1"/>
  <rect x="0.5" y="0.5" width="899" height="399" fill="none" stroke="#262626" stroke-width="1"/>
</svg>
